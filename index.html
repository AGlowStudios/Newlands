<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGlowStudios - Virtual Tool</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuentes futuristas -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Canvas para partículas de fondo -->
    <canvas id="particlesCanvas"></canvas>
    
    <!-- Efecto scanlines (líneas de TV antigua) -->
    <div class="scanlines"></div>
    
    <!-- PANTALLA DE CARGA -->
    <div id="loadingScreen" class="screen active">
        <div class="hud-frame">
            <!-- HUD: Barras de Red Reales -->
            <div class="hud-corner top-left">
                <div class="signal-bars" id="signalBars">
                    <div class="bar" data-level="1"></div>
                    <div class="bar" data-level="2"></div>
                    <div class="bar" data-level="3"></div>
                    <div class="bar" data-level="4"></div>
                </div>
                <span class="hud-text" id="networkSpeed">DETECTANDO...</span>
            </div>
            
            <!-- HUD: Texto Superior -->
            <div class="hud-corner top-right">
                <div class="warning-icon">⚠</div>
                <span class="hud-text">SYSTEM BOOT</span>
            </div>
            
            <!-- HUD: Radar Tracker (Mouse) -->
            <div class="hud-corner bottom-left">
                <div class="radar-grid">
                    <div class="radar-sweep"></div>
                    <div class="radar-blip" id="radarBlip"></div>
                </div>
                <span class="hud-text" style="margin-top: 5px; font-size: 0.6rem;">TRACKING: ACTIVE</span>
            </div>
            
            <!-- HUD: CPU/System Load -->
            <div class="hud-corner bottom-right">
                <div class="cpu-monitor">
                    <div class="cpu-bar" id="cpuBar"></div>
                </div>
                <span class="hud-text" style="margin-top: 5px;">SYS LOAD: <span id="cpuText">0%</span></span>
            </div>
        </div>
        
        <div class="loading-content">
            <h1 class="main-title" data-text="AGlowStudios">AGlowStudios</h1>
            <p class="subtitle">* virtual tool v0.0.1 *</p>
            
            <div class="loading-container">
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="progressBar"></div>
                    <div class="progress-text" id="progressText">INICIALIZANDO...</div>
                </div>
                <div class="loading-details">
                    <span id="compileText">Compilando módulos...</span>
                    <span id="memoryText">0/256MB</span>
                </div>
            </div>
            
            <div class="loading-status">
                <div class="status-dot"></div>
                <span id="statusText">Cargando recursos del sistema</span>
            </div>
        </div>
    </div>
    
    <!-- PANTALLA DE INICIO (MENU) -->
    <div id="startScreen" class="screen">
        <div class="hud-frame">
            <!-- Mantenemos el HUD funcional en el menú también -->
            <div class="hud-corner top-left">
                <div class="signal-bars" id="menuSignalBars">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <span class="hud-text" id="menuNetworkSpeed">---</span>
            </div>
            
            <div class="hud-corner top-right">
                <span class="hud-text" id="clockDisplay">00:00:00</span>
            </div>
            
            <div class="hud-corner bottom-left">
                <div class="radar-grid">
                    <div class="radar-blip" id="menuRadarBlip"></div>
                </div>
            </div>
            
            <div class="hud-corner bottom-right">
                <div class="cpu-monitor">
                    <div class="cpu-bar" id="menuCpuBar"></div>
                </div>
                <span class="hud-text">LOAD: <span id="menuCpuText">0%</span></span>
            </div>
        </div>
        
        <div class="menu-content">
            <h1 class="menu-title">AGlowStudios</h1>
            <p class="menu-subtitle">* virtual tool v0.0.1 *</p>
            
            <div class="menu-buttons">
                <button class="menu-btn neon-cyan" data-action="launch">
                    <span class="btn-text">INICIAR SISTEMA</span>
                    <div class="btn-glow"></div>
                </button>
                
                <button class="menu-btn neon-magenta" data-action="config">
                    <span class="btn-text">CONFIGURACIÓN</span>
                    <div class="btn-glow"></div>
                </button>
                
                <button class="menu-btn neon-cyan" data-action="tools">
                    <span class="btn-text">HERRAMIENTAS</span>
                    <div class="btn-glow"></div>
                </button>
                
                <button class="menu-btn neon-magenta" data-action="about">
                    <span class="btn-text">ACERCA DE</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
            
            <div class="system-info">
                <div class="info-item">
                    <span class="info-label">ESTADO:</span>
                    <span class="info-value" id="connectionStatus">VERIFICANDO...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">VERSIÓN:</span>
                    <span class="info-value">0.0.1-alpha</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
